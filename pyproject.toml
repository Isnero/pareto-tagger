[project]
name = "pareto-tagger"
version = "0.1.0"
description = "Multi-label LLM classifier for IT support tickets with Pareto report generation"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "ruff>=0.15.12",
]

[tool.uv.workspace]
members = [
    "apps/api",
]
